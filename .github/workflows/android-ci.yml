name: Android - compilation de vérification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
      - name: Installer le SDK Android
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-34' 'build-tools;34.0.0'
      - name: Tests de stabilité du header (JVM)
        run: |
          mkdir -p /tmp/onde-header-tests
          javac -encoding UTF-8 -d /tmp/onde-header-tests \
            app/src/main/java/fr/ondes/player/HeaderScrollRules.java \
            app/src/main/java/fr/ondes/player/HeaderMotionRules.java \
            app/src/main/java/fr/ondes/player/DualColorPickerRules.java \
            app/src/main/java/fr/ondes/player/PlaybackContinuityRules.java \
            app/src/main/java/fr/ondes/player/ThemePalette.java \
            app/src/main/java/fr/ondes/player/PlayingTrackRules.java \
            tests/HeaderScrollRulesTest.java \
            tests/HeaderMotionRulesTest.java \
            tests/DualColorPickerRulesTest.java \
            tests/PlaybackContinuityRulesTest.java \
            tests/ThemePaletteTest.java \
            tests/PlayingTrackRulesTest.java
          java -cp /tmp/onde-header-tests HeaderScrollRulesTest
          java -cp /tmp/onde-header-tests HeaderMotionRulesTest
          java -cp /tmp/onde-header-tests DualColorPickerRulesTest
          java -cp /tmp/onde-header-tests PlaybackContinuityRulesTest
          java -cp /tmp/onde-header-tests ThemePaletteTest
          java -cp /tmp/onde-header-tests PlayingTrackRulesTest
      - name: Construire APK debug (validation uniquement)
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: onde-player-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
